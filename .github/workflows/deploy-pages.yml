name: Deploy Docusaurus to GitHub Pages

on:
  # Trigger deployment on push to main branch
  push:
    branches:
      - main
    # Only trigger if changes are in the gutenberg directory
    paths:
      - 'gutenberg/**'
      - '.github/workflows/deploy-pages.yml'
  
  # Allow manual triggering from GitHub UI
  workflow_dispatch:

# Set GITHUB_TOKEN permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gutenberg
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for better performance with some Docusaurus features
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: './gutenberg/package-lock.json'
          cache: 'npm'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: |
          # Clean install for reproducible builds
          npm ci
          
      - name: Build Docusaurus site
        run: |
          # Set environment variables for build optimization
          export NODE_ENV=production
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run build
        env:
          # GitHub Pages specific environment variable
          GITHUB_PAGES: true

      - name: Verify build output
        run: |
          # Ensure build directory exists and contains expected files
          if [ ! -d "build" ]; then
            echo "Error: Build directory not found"
            exit 1
          fi
          
          if [ ! -f "build/index.html" ]; then
            echo "Error: index.html not found in build directory"
            exit 1
          fi
          
          echo "Build verification successful"
          echo "Build directory contents:"
          ls -la build/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./gutenberg/build

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Optional: Notify on deployment status
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    
    steps:
      - name: Deployment Success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Successfully deployed Docusaurus site to GitHub Pages"
          echo "🌐 Site URL: ${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}"
          
      - name: Deployment Failure
        if: needs.deploy.result == 'failure' || needs.build.result == 'failure'
        run: |
          echo "❌ Deployment failed. Check the logs above for details."
          exit 1